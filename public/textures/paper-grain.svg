<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180">
	<!-- Fine paper tooth. Tiled at 180x180 as the page background texture. -->
	<filter id="grain">
		<feTurbulence
			type="fractalNoise"
			baseFrequency="0.9"
			numOctaves="4"
			stitchTiles="stitch"
		/>
		<feColorMatrix type="saturate" values="0" />
	</filter>
	<rect width="100%" height="100%" filter="url(#grain)" />
</svg>
